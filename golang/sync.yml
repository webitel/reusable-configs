# Go services: synced by .github/workflows/sync-golang.yml with file-sync.
#
# defaults: template variables of every repository, deep-merged under each entry of repos.
# files:    synced to every repository; .njk files are rendered with the repository's variables.
# repos:    one entry per repository with its variables. Adding a repository = adding an entry here.
#
# Flags used by `when`:
#   service: deployable service (Debian maintainer scripts, OpenTelemetry env example, backports,
#            release branches). Tools such as chat-migration-cli set it to false.
#   deliver: build and upload a package for every pull request (pull-request-deliver.yml).

defaults:
  version: v2
  branch: main
  service: true
  deliver: true
  build:
    # Generic Debian maintainer scripts, synced from common/deploy/debian/ (files with when: service).
    # Repositories without them set scripts: ''.
    scripts: |
      postinstall: deploy/debian/postinst.sh
      preremove: deploy/debian/prerm.sh
      postremove: deploy/debian/postrm.sh

files:
  - source: golang/workflows/workflow.yml.njk
    dest: .github/workflows/workflow.yml

  - source: golang/workflows/pull-request.yml.njk
    dest: .github/workflows/pull-request.yml

  - source: common/workflows/pull-request-deliver.yml.njk
    dest: .github/workflows/pull-request-deliver.yml
    when: deliver

  - source: golang/configs/.gitignore
    dest: .gitignore

  - source: golang/.idea
    dest: .idea
    header: false

  - source: golang/.vscode
    dest: .vscode
    header: false

  - source: golang/configs/.editorconfig
    dest: .editorconfig

  - source: golang/configs/dependabot.yml
    dest: .github/dependabot.yml

  - source: golang/configs/.golangci.yaml
    dest: .golangci.yaml

  - source: common/workflows/dependabot-auto-merge.yml
    dest: .github/workflows/dependabot-auto-merge.yml

  - source: common/workflows/cleanup-artifacts.yml.njk
    dest: .github/workflows/cleanup-artifacts.yml

  - source: golang/configs/.env.otel.example
    dest: .env.otel.example
    when: service

  - source: common/deploy/debian/postinst.sh
    dest: deploy/debian/postinst.sh
    when: service

  - source: common/deploy/debian/prerm.sh
    dest: deploy/debian/prerm.sh
    when: service

  - source: common/deploy/debian/postrm.sh
    dest: deploy/debian/postrm.sh
    when: service

  - source: common/workflows/backport-trigger.yml.njk
    dest: .github/workflows/backport-trigger.yml
    when: service

  - source: common/workflows/backport.yml.njk
    dest: .github/workflows/backport.yml
    when: service

  - source: common/workflows/release-branch.yml
    dest: .github/workflows/release-branch.yml
    when: service

repos:
  webitel/call_audit:
    name: webitel-call-audit
    build:
      binary-name: webitel-call-audit
      ldflags: |
        -s -w
      scripts: ''

  webitel/call_center:
    name: webitel-call-center
    build:
      binary-name: webitel-call-center
      ldflags: |
        -s -w
        -X github.com/webitel/call_center/model.BuildNumber=${{ github.run_number }}
        -X github.com/webitel/call_center/model.CurrentVersion=${{ format('{0}{1}', needs.prepare.outputs.version, (github.event.repository.default_branch == github.ref_name || github.event.pull_request.number) && '-dev' || '') }}
      package-contents: |
        src=deploy/systemd/webitel-call-center.service dst=/etc/systemd/system/webitel-call-center.service type=config
        src=.env.example dst=/etc/default/webitel-call-center type=config mode=0640

  webitel/cases:
    name: webitel-cases
    build:
      binary-name: webitel-cases
      ldflags: |
        -s -w
