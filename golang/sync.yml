      ldflags: |
        -s -w
        -X github.com/webitel/chat-migration-cli/internal/buildinfo.Version=${{ needs.prepare.outputs.full-version }}
        -X github.com/webitel/chat-migration-cli/internal/buildinfo.BuildNumber=${{ needs.prepare.outputs.version-build }}
        -X github.com/webitel/chat-migration-cli/internal/buildinfo.GitCommit=${{ github.sha }}
        -X github.com/webitel/chat-migration-cli/internal/buildinfo.BuildTime=${{ needs.prepare.outputs.build-timestamp }}
      scripts: ''
    service: false

  webitel/chat_manager:
