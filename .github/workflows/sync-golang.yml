name: Sync Golang

on:
  push:
    branches: [ main ]
    paths:
      - common/**
      - golang/**
      - .github/workflows/sync-golang.yml
      - .github/workflows/sync-reusable.yml

  # Daily run keeps the status issue current after sync PRs are merged; it pushes nothing without changes
  schedule:
    - cron: '10 5 * * *'

  workflow_dispatch:
    inputs:
      dry-run:
        description: Show what would be synced without pushing or opening pull requests
        type: boolean
        default: false

concurrency:
  group: sync-golang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - config-path: golang/sync.yml
            sync-type: dynamic

          - config-path: golang/sync-static.yml
            sync-type: static

    uses: ./.github/workflows/sync-reusable.yml
    secrets: inherit
    with:
      config-path: ${{ matrix.config-path }}
      sync-type: ${{ matrix.sync-type }}
      dry-run: ${{ inputs.dry-run == true }}
      repositories: |
        call_audit
        call_center
        cases
        chat-migration-cli
        chat_manager
        engine
        flow_manager
        im-account-service
        im-contact-service
        im-delivery-service
        im-gateway-service
        im-providers-service
        im-thread-service
        logger
        media-exporter
        nomad-driver-systemd
        storage
        webitel-fts
        webitel-kb
        webitel-wfm
        webitel.go
        webrtc_recorder
        web-meeting-backend
