name: Sync Golang

on:
  push:
    branches: [ main ]
    paths:
      - common/**
      - golang/**
      - .github/workflows/sync-golang.yml
      - .github/workflows/sync-reusable.yml

  # Daily run keeps the status issue current after sync PRs are merged; it pushes nothing without changes
  schedule:
    - cron: '10 5 * * *'

  workflow_dispatch:
    inputs:
      dry-run:
        description: Show what would be synced without pushing or opening pull requests
        type: boolean
        default: false

concurrency:
  group: sync-golang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync
    uses: ./.github/workflows/sync-reusable.yml
    secrets: inherit
    with:
      stack: golang
      dry-run: ${{ inputs.dry-run == true }}
