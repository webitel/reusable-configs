name: Sync Reusable

on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
      sync-type:
        required: true
        type: string
      repositories:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: Files (${{ inputs.sync-type }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # file-sync lists the source commits each sync brings
          fetch-depth: 0

      - name: Create Github APP token
        uses: webitel/reusable-workflows/actions/create-github-app-token@create-github-app-token-v1
        id: app-token
        with:
          app-id: ${{ vars.DELIVERY_BOT_APP_ID }}
          private-key: ${{ secrets.DELIVERY_BOT_APP_PEM }}
          owner: ${{ github.repository_owner }}
          # The status issue lives in this repository
          repositories: |
            ${{ inputs.repositories }}
            reusable-configs

      - name: Sync files across repositories
        uses: webitel/reusable-workflows/actions/file-sync@file-sync-v3
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USERNAME: ${{ steps.app-token.outputs.user-name }}
          GIT_EMAIL: ${{ steps.app-token.outputs.user-email }}
          CONFIG_PATH: ${{ inputs.config-path }}
          PR_LABELS: sync,${{ inputs.sync-type }}
          ASSIGNEES: kirychukyurii
          FILE_HEADER: true
          STATUS_ISSUE: File sync status
          OVERWRITE_EXISTING_PR: true
          DRY_RUN: ${{ inputs.dry-run }}
          BRANCH_PREFIX: repo-sync/${{ inputs.sync-type }}
          NUNJUCKS_VARIABLE_START: "((("
          NUNJUCKS_VARIABLE_END: ")))"
