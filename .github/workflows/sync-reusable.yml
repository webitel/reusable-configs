name: Sync Reusable

on:
  workflow_call:
    inputs:
      stack:
        description: Stack directory; its sync.yml lists the files and the target repositories
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  sync:
    name: Files (${{ inputs.stack }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # file-sync lists the source commits each sync brings
          fetch-depth: 0

      # The token is scoped to the repositories of the sync config, plus this repository for the status issue
      - name: List target repositories
        id: repos
        env:
          CONFIG_PATH: ${{ inputs.stack }}/sync.yml
        run: |
          {
            echo 'names<<EOF'
            yq -r '.repos | keys | .[] | sub("^[^/]+/"; "") | sub("@.*$"; "")' "$CONFIG_PATH" | sort -u
            echo reusable-configs
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Github APP token
        uses: webitel/reusable-workflows/actions/create-github-app-token@create-github-app-token-v1
        id: app-token
        with:
          app-id: ${{ vars.DELIVERY_BOT_APP_ID }}
          private-key: ${{ secrets.DELIVERY_BOT_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.names }}

      - name: Sync files across repositories
        uses: webitel/reusable-workflows/actions/file-sync@file-sync-v3
        with:
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USERNAME: ${{ steps.app-token.outputs.user-name }}
          GIT_EMAIL: ${{ steps.app-token.outputs.user-email }}
          CONFIG_PATH: ${{ inputs.stack }}/sync.yml
          PR_LABELS: sync,${{ inputs.stack }}
          ASSIGNEES: kirychukyurii
          FILE_HEADER: true
          STATUS_ISSUE: File sync status
          OVERWRITE_EXISTING_PR: true
          DRY_RUN: ${{ inputs.dry-run }}
          BRANCH_PREFIX: repo-sync/${{ inputs.stack }}
          NUNJUCKS_VARIABLE_START: "((("
          NUNJUCKS_VARIABLE_END: ")))"
